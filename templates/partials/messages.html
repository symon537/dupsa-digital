{% if messages %}
<div class="mb-3">
  {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% elif m.tags == 'debug' %}secondary{% else %}{{ m.tags|default:'info' }}{% endif %} alert-dismissible fade show py-2 mb-2" role="alert">
      {{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}
</div>
{% endif %}
