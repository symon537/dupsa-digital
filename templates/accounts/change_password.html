{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<form method="post" class="card-form" style="max-width:520px" novalidate>{% csrf_token %}
{% if form.non_field_errors %}<div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-mk px-4">Update password</button></form>
{% endblock %}
