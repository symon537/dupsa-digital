{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>{% if edited %}Edit user: {{ edited.username }}{% else %}New user{% endif %}</h1></div>
<form method="post" class="card-form" novalidate>{% csrf_token %}{% include "partials/form_fields.html" %}
<div class="mt-4 d-flex gap-2"><button class="btn btn-mk px-4">Save</button><a class="btn btn-outline-secondary" href="{% url 'accounts:user_list' %}">Cancel</a></div></form>
{% endblock %}
