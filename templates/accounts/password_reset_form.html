{% extends "base_auth.html" %}{% load static %}
{% block body %}<main class="login-page"><section class="login-card"><div class="brand-stack"><img src="{% static 'images/emblem-color.png' %}" alt=""></div>
<h1 class="login-title">Reset password</h1><p class="login-sub">Enter your email and we will send a reset link.</p>
<form method="post" class="login-form-panel">{% csrf_token %}{{ form.email.errors }}<label for="{{ form.email.id_for_label }}">Email</label>{{ form.email }}
<button class="btn btn-signin mt-3">Send reset link</button></form><p class="text-center mt-3 small"><a href="{% url 'accounts:login' %}">Back to sign in</a></p></section></main>{% endblock %}
